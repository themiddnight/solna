<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <!-- Grid Pattern: Pure gray 24px squares with 20% opacity lines and no background fill -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#808080" stroke-width="0.75" stroke-opacity="0.2" />
    </pattern>
  </defs>

  <!-- Pure Transparent Grid Layer -->
  <rect width="100%" height="100%" fill="url(#grid)" />
</svg>
